[alembic]
# path to migration scripts
script_location = alembic

# database URL (overridden by DATABASE_URL env var in env.py)
sqlalchemy.url =

# version location
version_locations = alembic/versions

# timezone to use when generating revision dates
# timezones = utc

[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# whenever a new revision is generated.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
